- type: entity
  name: true devil
  id: MobLesserDevil
  parent: [ SimpleSpaceMobBase, MobCombat ]
  description: A pile of infernal energy, taking a vaguely humanoid form.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Goobstation/Devil/32x64.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: true_devil
  - type: DamageStateVisuals
    states:
      Alive:
        Base: true_devil
      Dead:
        Base: true_devil
  - type: MobThresholds
    thresholds:
      0: Alive
      350: Dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Piercing: 10
  - type: Body
    prototype: Human
  - type: UniversalLanguageSpeaker
  - type: Vocal
  - type: StatusEffects
    allowed:
    - SlowedDown
    - Stutter
    - TemporaryBlindness
    - RadiationProtection
    - Adrenaline
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ManifestedSpirit
  - type: Puller
    needsHands: false
  - type: InventorySlots
  - type: Inventory
    templateId: holoclown
  - type: Hands
  - type: InputMover
  - type: ComplexInteraction
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 9999
  - type: DevilLesserForm
  - type: MovementSpeedModifier # Solar: lesser form is faster than a person
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5.75
  - type: ThermalVision
    isActive: true
    color: white
    drawOverlay: false
    lightRadius: 0
    toggleAction: null
    thermalShader: null
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: Store
    categories:
    - DevilAbilities
    currencyWhitelist:
    - SoulsStored

- type: entity
  name: archdevil
  id: MobArchDevil
  parent: [ SimpleSpaceMobBase, MobCombat ]
  description: Daemon qui formam ultimam attigit.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Goobstation/Devil/32x64.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: arch_devil
  - type: DamageStateVisuals
    states:
      Alive:
        Base: arch_devil
      Dead:
        Base: arch_devil
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead # Parity would be 5000 so don't complain
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Piercing: 10
        Heat: 15
        Structural: 50
  - type: FootstepModifier
    footstepSoundCollection:
      collection: XenoFootstepLarge
  - type: EmitSoundOnSpawn
    sound:
      collection: ArchScream
      params:
        volume: 8
        maxDistance: 60
        pitch: 0.2
  - type: ThermalVision
    isActive: true
    color: white
    drawOverlay: false
    lightRadius: 0
    toggleAction: null
    thermalShader: null
  - type: SlowOnDamage
    speedModifierThresholds:
      2000: 0.7
      2250: 0.5
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ManifestedSpirit
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Insulated
  - type: StatusEffects
    allowed:
    - SlowedDown
    - Stutter
    - TemporaryBlindness
    - RadiationProtection
    - Adrenaline
  - type: Body
    prototype: Human
  - type: UniversalLanguageSpeaker
  - type: Vocal
  - type: Speech
    speechVerb: LargeMob
  - type: Puller
    needsHands: false
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 9999
  - type: InventorySlots
  - type: Inventory
    templateId: holoclown # Less stuff
  - type: Hands
  - type: InputMover
  - type: ComplexInteraction
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Archdevil
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

  - type: Store
    categories:
    - DevilAbilities
    currencyWhitelist:
    - SoulsStored

- type: entity
  name: frog
  parent: MobFrog
  id: MobFrogPathetic
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: Body
    prototype: Animal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:GibBehavior
        recursive: true


# Solar: weak minion summoned by a lesser devil. Uses the true devil sprite, shrunk and darkened, until it gets art of its own.
- type: entity
  name: imp
  id: MobDevilImp
  parent: [ SimpleSpaceMobBase, MobCombat ]
  description: A small, cackling creature from below.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Goobstation/Devil/32x64.rsi
    scale: 0.6, 0.6
    color: "#b84040"
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: true_devil
  - type: DamageStateVisuals
    states:
      Alive:
        Base: true_devil
      Dead:
        Base: true_devil
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Slash: 5
        Heat: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ManifestedSpirit
  - type: DevilMinion
  - type: UniversalLanguageSpeaker
  - type: Puller
    needsHands: false
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-devil-imp-name
    description: ghost-role-information-devil-imp-description
    rules: ghost-role-information-devil-imp-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
