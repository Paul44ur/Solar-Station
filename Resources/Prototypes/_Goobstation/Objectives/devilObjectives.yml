- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseDevilObjective
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-devil

- type: entity
  parent: BaseDevilObjective
  id: DevilContractObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/bureaucracy.rsi
      state: contract-written
  - type: NumberObjective
    min: 7
    max: 9
    title: objective-condition-contract-title
    description: objective-condition-contract-description
  - type: SignContractCondition

- type: entity
  parent: BaseDevilObjective
  id: DevilWeightObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Economy/cash.rsi
      state: cash_5000
  - type: NumberObjective
    min: 150
    max: 200
    title: objective-condition-weight-title
    description: objective-condition-weight-description
  - type: MeetContractWeightCondition

# Solar
- type: entity
  parent: BaseDevilObjective
  id: DevilDepartmentObjective
  name: Bargain with every department
  description: Get a contract signed by someone from Command, Security, Engineering, Medical, Science, Cargo and Service.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/bureaucracy.rsi
      state: contract-written
  - type: DevilDepartmentContractsCondition
    departments:
    - Command
    - Security
    - Engineering
    - Medical
    - Science
    - Cargo
    - Civilian
